<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Muslim Group — Information Management &amp; Control System</title>
  <meta name="description"
    content="Al-Muslim Group — Information Management &amp; Control System for physical machinery, transfers, spare parts, and workforce management.">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- High-Priority ES Module Preloading (Parallel Pipeline) -->
  <link rel="modulepreload" href="js/app.js?v=4.29.0">
  <link rel="modulepreload" href="js/state.js?v=4.29.0">
  <link rel="modulepreload" href="js/db/storage.js?v=4.29.0">

  <link rel="modulepreload" href="js/components/sidebar.js">
  <link rel="modulepreload" href="js/components/navbar.js?v=4.29.0">
  <!-- Dynamic Base Path for GitHub Pages & Local Hosting SPA Routing -->
  <script>
    (function () {
      var l = window.location;
      var isGh = l.pathname.toLowerCase().startsWith('/erp');
      var basePrefix = isGh ? '/ERP' : '';

      // 1. Direct ERP Portal instant URL redirect if visiting root domain
      try {
        var mode = localStorage.getItem('al_muslim_homepage_visibility_mode') || 'login';
        var hasUser = !!localStorage.getItem('al_muslim_active_user_id');
        var isPreview = l.search && (l.search.indexOf('preview=1') !== -1 || l.search.indexOf('preview_home=1') !== -1);
        var normPath = l.pathname.replace(/\/+$/, '').toLowerCase();
        var isRoot = (normPath === '' || normPath === '/' || normPath === '/index.html' || normPath === '/erp');
        if (mode === 'login' && !isPreview && isRoot) {
          var targetLogin = basePrefix + (hasUser ? '/dashboard' : '/login') + (l.search || '') + (l.hash || '');
          window.history.replaceState(null, null, targetLogin);
        }
      } catch (_) { }

      // 2. Unpack GitHub Pages 404 redirect (?p=/inventory&tab=...)
      if (l.search) {
        var q = {};
        var raw = l.search.slice(1).split('&');
        for (var i = 0; i < raw.length; i++) {
          var parts = raw[i].split('=');
          if (parts[0]) q[parts[0]] = parts.slice(1).join('=');
        }
        if (q.p !== undefined) {
          var restoredPath = decodeURIComponent(q.p);
          delete q.p;
          var restoredHash = q.hash ? '#' + decodeURIComponent(q.hash) : (l.hash || '');
          delete q.hash;

          var remainingParams = Object.keys(q).map(function (k) {
            return k + (q[k] ? '=' + q[k] : '');
          }).join('&');

          var normalizedRoute = restoredPath.startsWith('/') ? restoredPath : '/' + restoredPath;
          var finalUrl = basePrefix + normalizedRoute + (remainingParams ? '?' + remainingParams : '') + restoredHash;

          try {
            window.history.replaceState(null, null, finalUrl);
          } catch (_) { }
        }
      }

      // 3. Set dynamic <base href> so relative stylesheets and modules resolve seamlessly
      var pathname = window.location.pathname.toLowerCase();
      var baseHref = pathname.startsWith('/erp') ? '/ERP/' : '/';
      var baseEl = document.querySelector('base');
      if (!baseEl) {
        baseEl = document.createElement('base');
        baseEl.href = baseHref;
        document.head.insertBefore(baseEl, document.head.firstChild);
      }
    })();
  </script>

  <!-- Instant Daylight/Dark Theme Pre-Init (Zero Visual Flash) -->
  <script>
    try {
      if (localStorage.getItem('al_muslim_theme') === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    } catch (_) { }
  </script>

  <!-- Modern Industrial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- Global Safe Startup Pre-Initializers -->
  <script>
    // Bulletproof JSON.parse defense against 'undefined', empty strings, or null values
    (function () {
      var _nativeJSONParse = JSON.parse;
      JSON.parse = function (text, reviver) {
        if (text === undefined || text === null || text === '' || text === 'undefined' || text === 'null') {
          return null;
        }
        if (typeof text === 'string') {
          var t = text.trim();
          if (t === '' || t === 'undefined' || t === 'null') {
            return null;
          }
        }
        return _nativeJSONParse.call(JSON, text, reviver);
      };
    })();
  </script>

  <!-- Core ERP Stylesheets (Cache-Busted v4.30.3) -->
  <link rel="stylesheet" href="css/app.css?v=4.30.3">
  <link rel="stylesheet" href="css/grid.css?v=4.30.3">
  <link rel="stylesheet" href="css/components.css?v=4.30.3">
  <link rel="stylesheet" href="css/print.css?v=4.30.3">

  <!-- Ultra-Fast Boot: All heavy third-party libraries (SheetJS, QRCode, Camera Scanner, Tesseract OCR, PDF.js) are loaded 100% on demand when explicitly requested -->
</head>

<body>
  <!-- Single Page Application Shell Root -->
  <div id="app-root">
    <div id="app-initial-shell"
      style="min-height: 100vh; background-color: #040911; background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px); background-size: 28px 28px; display: flex; align-items: center; justify-content: center;">
      <!-- Subtle Executive Top Accent Line (Zero distracting emojis or bulky text) -->
      <div style="position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #0284c7, #38bdf8, #10b981); z-index: 9999; animation: execBarPulse 1s infinite alternate ease-in-out;"></div>
    </div>
  </div>

  <!-- Global Startup Error Handler & Watchdog -->
  <script>
    window.__appLoaded = false;
    window.__showStartupError = function (errorMsg, detail) {
      if (window.__appLoaded) return;
      var root = document.getElementById('app-root');
      if (!root) return;
      root.innerHTML =
        '<div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #090d16; color: #fff; font-family: sans-serif; padding: 20px;">' +
        '<div style="max-width: 540px; width: 100%; background: #111827; border: 1px solid #ef4444; border-radius: 12px; padding: 28px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6); text-align: center;">' +
        '<div style="font-size: 42px; margin-bottom: 12px;">⚠️</div>' +
        '<h2 style="font-size: 18px; font-weight: 800; color: #f87171; margin-bottom: 8px;">Startup Diagnostic Alert</h2>' +
        '<p style="font-size: 13px; color: #cbd5e1; margin-bottom: 16px;">' + (errorMsg || 'The application encountered an issue while initializing components.') + '</p>' +
        (detail ? '<div style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; color: #fca5a5; text-align: left; margin-bottom: 20px; word-break: break-word; max-height: 180px; overflow-y: auto; white-space: pre-wrap;">' + detail + '</div>' : '') +
        '<div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">' +
        '<button onclick="window.__forceFreshReload ? window.__forceFreshReload() : window.location.reload()" style="background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer;">🔄 Fresh Reload &amp; Clear Cache</button>' +
        '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href = window.location.origin + window.location.pathname + \'?reset=\' + Date.now();" style="background: #374151; color: #e2e8f0; border: 1px solid #4b5563; padding: 10px 18px; border-radius: 6px; font-size: 13px; cursor: pointer;">🧹 Reset Storage &amp; Restart</button>' +
        '</div>' +
        '<p style="font-size: 11px; color: #94a3b8; margin-top: 14px; margin-bottom: 0;">Tip: Press <b>Ctrl + Shift + R</b> (or <b>Ctrl + F5</b>) to bypass browser cache.</p>' +
        '</div>' +
        '</div>';
    };

    window.addEventListener('error', function (e) {
      try {
        fetch('/api/client-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'window.error', message: (e.message || '') + ' at ' + (e.filename || '') + ':' + (e.lineno || ''), stack: e.error ? e.error.stack : null })
        }).catch(function () { });
      } catch (_) { }
      if (!window.__appLoaded) {
        var detailMsg = (e.message || 'Unknown script error') + ' at ' + (e.filename || '') + ':' + (e.lineno || '');
        if (e.error && e.error.stack) {
          detailMsg += '\n' + e.error.stack;
        }
        window.__showStartupError('JavaScript Initialization Error', detailMsg);
      }
    });

    window.addEventListener('unhandledrejection', function (e) {
      try {
        fetch('/api/client-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'unhandledrejection', message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise rejection', stack: e.reason && e.reason.stack ? e.reason.stack : null })
        }).catch(function () { });
      } catch (_) { }
      if (!window.__appLoaded) {
        var detailMsg = e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise rejection';
        if (e.reason && e.reason.stack) {
          detailMsg += '\n' + e.reason.stack;
        }
        window.__showStartupError('Asynchronous Startup Rejection', detailMsg);
      }
    });

    // Global console.error capturer
    var origConsoleErr = console.error;
    console.error = function () {
      origConsoleErr.apply(console, arguments);
      try {
        var msg = Array.prototype.slice.call(arguments).map(function (arg) {
          if (arg instanceof Error) return arg.stack || arg.message;
          if (typeof arg === 'object') return JSON.stringify(arg);
          return String(arg);
        }).join(' ');
        fetch('/api/client-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'console.error', message: msg })
        }).catch(function () { });
      } catch (_) { }
    };

    // Startup Safety Watchdog
    setTimeout(function () {
      if (!window.__appLoaded) {
        if (window.app && typeof window.app.init === 'function') {
          try {
            window.app.init();
            window.__appLoaded = true;
            return;
          } catch (_) { }
        }
        window.__showStartupError('Startup Timeout Notice', 'The application took longer than expected to launch. Click Retry to reload.');
      }
    }, 25000);

    window.__forceFreshReload = function () {
      try {
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (_) { }
      try { localStorage.clear(); } catch (_) { }
      try { sessionStorage.clear(); } catch (_) { }
      var base = window.location.origin + window.location.pathname;
      window.location.replace(base + '?t=' + Date.now() + window.location.hash);
    };

    // Build version v4.30.3 — Architectural Batch Mutations, Zero-Leak Listeners & Memory Optimization
    var CURRENT_BUILD = '4.30.3';

    // Cache Lifecycle: Only invalidate browser caches when a new build is detected
    (function () {
      try {
        var lastBuild = localStorage.getItem('al_muslim_build_ver');
        if (lastBuild !== CURRENT_BUILD) {
          if (window.caches) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          localStorage.setItem('al_muslim_build_ver', CURRENT_BUILD);
        }
      } catch (e) { /* non-critical */ }
    })();

    // Enterprise Service Worker Registration (0ms Instant Load from Cache)
    (function () {
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function () {
          var isGh = window.location.pathname.toLowerCase().startsWith('/erp');
          var swUrl = (isGh ? '/ERP/' : '/') + 'sw.js?v=' + CURRENT_BUILD;
          navigator.serviceWorker.register(swUrl).then(function (reg) {
            reg.update();
          }).catch(function () {});
        });
      }
    })();
  </script>

  <!-- Main ES Module Application Entrypoint (Cache-Busted v4.30.3) -->
  <script type="module" src="js/app.js?v=4.30.3"></script>

  <style>
    @keyframes execBarPulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</body>

</html>
