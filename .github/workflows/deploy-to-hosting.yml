name: 🚀 Deploy ERP to cPanel Hosting (moviezonex.com)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual deploy reason (optional)'
        required: false
        default: 'Manual deployment trigger'

# ─────────────────────────────────────────────────────────────
# REQUIRED GitHub Repository Secrets (Settings → Secrets → Actions):
#
#   FTP_SERVER        → Your cPanel FTP host, e.g. ftp.moviezonex.com
#   FTP_USERNAME      → cPanel FTP username, e.g. motaherh_erpadmin
#   FTP_PASSWORD      → cPanel FTP password
#   FTP_SERVER_DIR    → Remote path to your Node.js app root
#                       e.g. /home/motaherh/nodejs_apps/erp/
#                       (find this in cPanel → Setup Node.js App)
#
#   SSH_HOST          → Same as FTP_SERVER or your server IP
#   SSH_USERNAME      → SSH username (usually same as cPanel username)
#   SSH_PASSWORD      → SSH password (or use SSH_PRIVATE_KEY below)
#   SSH_PRIVATE_KEY   → (Recommended) Your SSH private key content
#
#   NODE_APP_NAME     → The Node.js App name as shown in cPanel's
#                       "Setup Node.js App" panel, e.g. "erp_app"
#   NODE_APP_DIR      → Full server path to app, same as FTP_SERVER_DIR
#                       e.g. /home/motaherh/nodejs_apps/erp
# ─────────────────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — DEPLOY FILES VIA FTP
  # ═══════════════════════════════════════════════════════════
  deploy-files:
    name: 📁 Upload Files via FTP
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📤 Deploy all files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Exclude files that should NOT be uploaded / touched on the server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README.md
            **/.gitignore
            **/.env.example
            # CRITICAL: Never overwrite the live MySQL API on the server
            **/mysql_api.php
          # Only upload changed files (smart sync — much faster)
          dangerous-clean-slate: false
          log-level: verbose

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — RESTART NODE.JS APP ON cPANEL VIA SSH
  #          (runs after file upload completes)
  # ═══════════════════════════════════════════════════════════
  restart-nodejs:
    name: 🔄 Restart Node.js App on cPanel
    runs-on: ubuntu-latest
    needs: deploy-files   # Only runs if file upload succeeded
    steps:
      - name: 🔑 SSH into server & restart Node.js app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting ERP deployment on $(hostname)"
            cd /home/motaherh/moviezonex.com

            # Activate cPanel virtual environment & install dependencies
            echo "📦 Installing Node.js dependencies..."
            source /home/motaherh/nodevenv/moviezonex.com/20/bin/activate
            npm install --production --silent

            # Restart cPanel Node.js app via Passenger restart mechanism
            echo "🔄 Restarting Node.js app via cPanel Passenger..."
            mkdir -p tmp
            touch tmp/restart.txt
            echo "✅ Restart signal sent — ERP is live at https://moviezonex.com/erp_app"

  # ═══════════════════════════════════════════════════════════
  # JOB 3 — HEALTH CHECK (verify the site is responding)
  # ═══════════════════════════════════════════════════════════
  health-check:
    name: 🏥 Verify Site is Live
    runs-on: ubuntu-latest
    needs: restart-nodejs
    steps:
      - name: ⏳ Wait 15s for Node.js app to restart
        run: sleep 15

      - name: 🌐 Check ERP health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://moviezonex.com/api/health || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ SUCCESS: ERP is live and responding at https://moviezonex.com"
          elif [ "$STATUS" = "000" ]; then
            echo "⚠️  WARNING: Could not reach https://moviezonex.com — server may still be starting up."
            echo "   Check cPanel -> Setup Node.js App to verify the app is running."
          else
            echo "⚠️  WARNING: Site returned HTTP $STATUS — check cPanel logs."
          fi
