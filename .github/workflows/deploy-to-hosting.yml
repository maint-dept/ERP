name: 🚀 Deploy ERP to cPanel Hosting (moviezonex.com)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual deploy reason (optional)'
        required: false
        default: 'Manual deployment trigger'

# ─────────────────────────────────────────────────────────────
# REQUIRED GitHub Repository Secrets (Settings → Secrets and variables → Actions):
#
#   1. FTP_SERVER      → moviezonex.com
#   2. FTP_USERNAME    → motaherh
#   3. FTP_PASSWORD    → (Your cPanel login password)
#   4. FTP_SERVER_DIR  → moviezonex.com/
#
#   5. SSH_HOST        → moviezonex.com
#   6. SSH_USERNAME    → motaherh
#   7. SSH_PASSWORD    → (Your cPanel login password)
# ─────────────────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — DEPLOY FILES VIA FTP
  # ═══════════════════════════════════════════════════════════
  deploy-files:
    name: 📁 Upload Files via FTP
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Diagnose host connectivity
        run: |
          python3 -c "
          import socket, os
          targets = [
              (os.environ.get('FTP_SERVER', ''), 21),
              ('galaxy.hostursite.us', 21),
              ('46.224.111.36', 21),
              ('moviezonex.com', 21),
              ('ftp.moviezonex.com', 21),
              ('46.224.111.36', 22)
          ]
          for host, port in targets:
              if not host:
                  continue
              try:
                  s = socket.create_connection((host, port), timeout=3)
                  banner = s.recv(100).decode('utf-8', errors='ignore').strip()
                  print(f'::notice title=Reachable::{host}:{port} -> {banner}')
                  s.close()
              except Exception as err:
                  print(f'::warning title=Unreachable::{host}:{port} -> {err}')
          "
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}

      - name: 🔄 Prepare Passenger restart file
        run: |
          mkdir -p tmp
          date +%s > tmp/restart.txt

      - name: 🔍 Test FTP Login & Print Diagnostics
        run: |
          python3 - << 'EOF' >> $GITHUB_STEP_SUMMARY
          import os, ftplib, ssl

          server = os.environ.get('FTP_SERVER') or 'moviezonex.com'
          user = os.environ.get('FTP_USERNAME') or ''
          pw = os.environ.get('FTP_PASSWORD') or ''
          sdir = os.environ.get('FTP_SERVER_DIR') or 'moviezonex.com/'

          print("### 🔍 FTP Deployment Diagnostics")
          print(f"- **Server:** `{server}`")
          print(f"- **Target Dir:** `{sdir}`")
          print(f"- **User Secret Configured:** `{'YES' if user else 'NO (EMPTY!)'}`")
          print(f"- **Password Secret Configured:** `{'YES' if pw else 'NO (EMPTY!)'}`")

          if not user or not pw:
              print("\n> ❌ **CRITICAL ERROR**: `FTP_USERNAME` or `FTP_PASSWORD` is not set in GitHub repository secrets!")
              exit(1)

          class LooseFTP_TLS(ftplib.FTP_TLS):
              def connect(self, host='', port=0, timeout=-999):
                  self.context = ssl._create_unverified_context()
                  return super().connect(host, port, timeout)

          for proto, client_cls in [('FTPS (Explicit TLS)', LooseFTP_TLS), ('Plain FTP', ftplib.FTP)]:
              try:
                  print(f"\n#### Testing {proto} to `{server}:21`...")
                  ftp = client_cls(timeout=10)
                  ftp.connect(server, 21)
                  if proto.startswith('FTPS'):
                      ftp.auth()
                      ftp.login(user, pw)
                      ftp.prot_p()
                  else:
                      ftp.login(user, pw)
                  pwd = ftp.pwd()
                  print(f"✅ **Login Successful!** Current Directory: `{pwd}`")
                  files = ftp.nlst()
                  print(f"- Directory listing ({len(files)} items): `{files[:15]}`")
                  ftp.quit()
                  break
              except Exception as err:
                  print(f"❌ **Failed {proto}**: `{err}`")
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || 'moviezonex.com' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'moviezonex.com/' }}

      - name: 📤 Deploy all files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'moviezonex.com' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'moviezonex.com/' }}
          protocol: ftps
          security: loose
          # Exclude files that should NOT be uploaded / touched on the server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README.md
            **/.gitignore
            **/.env.example
            # CRITICAL: Never overwrite the live MySQL API on the server
            **/mysql_api.php
          # Only upload changed files (smart sync — much faster)
          dangerous-clean-slate: false
          log-level: verbose

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — RESTART NODE.JS APP ON cPANEL VIA SSH (OPTIONAL)
  #          (runs after file upload completes)
  # ═══════════════════════════════════════════════════════════
  restart-nodejs:
    name: 🔄 Restart Node.js App on cPanel
    runs-on: ubuntu-latest
    needs: deploy-files
    continue-on-error: true   # If shared host disables SSH, FTP Passenger restart.txt handles it
    steps:
      - name: 🔑 SSH into server & restart Node.js app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting ERP deployment on $(hostname)"
            cd /home/motaherh/moviezonex.com

            # Activate cPanel virtual environment & install dependencies
            echo "📦 Installing Node.js dependencies..."
            source /home/motaherh/nodevenv/moviezonex.com/20/bin/activate
            npm install --production --silent

            # Restart cPanel Node.js app via Passenger restart mechanism
            echo "🔄 Restarting Node.js app via cPanel Passenger..."
            mkdir -p tmp
            touch tmp/restart.txt
            echo "✅ Restart signal sent — ERP is live at https://moviezonex.com/erp_app"

  # ═══════════════════════════════════════════════════════════
  # JOB 3 — HEALTH CHECK (verify the site is responding)
  # ═══════════════════════════════════════════════════════════
  health-check:
    name: 🏥 Verify Site is Live
    runs-on: ubuntu-latest
    needs: [deploy-files]
    steps:
      - name: ⏳ Wait 15s for Node.js app to restart
        run: sleep 15

      - name: 🌐 Check ERP health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://moviezonex.com/api/health || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ SUCCESS: ERP is live and responding at https://moviezonex.com"
          elif [ "$STATUS" = "000" ]; then
            echo "⚠️  WARNING: Could not reach https://moviezonex.com — server may still be starting up."
            echo "   Check cPanel -> Setup Node.js App to verify the app is running."
          else
            echo "⚠️  WARNING: Site returned HTTP $STATUS — check cPanel logs."
          fi
